# Daily swing screener — target 5-10% in 5-10 days (NSE cash)
# Chartink is used because it supports technical price-action scans.
# Screener.in is better for fundamentals; use it manually as a second filter if needed.

schedule:
  # Recommended run time: after market close (3:45 PM IST) or before open (9:00 AM IST)
  timezone: Asia/Kolkata

picks:
  max_daily_picks: 3          # Top N stocks to recommend
  min_candidates: 1           # Fail if screener returns fewer than this
  max_candidates: 40          # Cap total pool before ranking

# Price & liquidity filters (also mirrored in Chartink scan_clause below).
# Why ₹100–₹10,000?
#   - Below ₹100: penny stocks — thin liquidity, wide spreads, manipulation risk.
#   - Above ₹10,000: very few NSE names; caps position sizing for small accounts.
#   - Sweet spot ₹500–₹5,000: liquid mid/large caps where 5–10% swings are tradable.
# Adjust price_min / price_max here AND in each scan_clause if you change the band.
filters:
  price_min: 100
  price_max: 10000
  min_turnover_inr: 50000000   # ₹5 Cr daily turnover minimum
  max_daily_change_pct: 8.0    # Reject overextended breakout days
  reject_overextended: true

cooldown:
  enabled: true
  days: 7                      # Skip symbols picked in the last 7 calendar days
  history_file: logs/pick_history.json

risk:
  stop_loss_pct: 3.0           # Default fallback
  target_min_pct: 5.0
  target_max_pct: 10.0
  partial_exit_pct: 50.0       # Book half at first target
  breakeven_after_pct: 4.0     # Move stop to entry after this gain
  use_atr_stops: true           # Dynamic ATR-based stop (overrides fixed %)
  atr_stop_multiplier: 1.5
  min_stop_pct: 2.0
  max_stop_pct: 6.0
  # Setup-specific risk — tighter stops for pullbacks, wider for breakouts.
  by_setup:
    Breakout Momentum:
      stop_loss_pct: 4.0
      target_min_pct: 6.0
      target_max_pct: 12.0
    EMA Pullback:
      stop_loss_pct: 2.5
      target_min_pct: 5.0
      target_max_pct: 8.0
    Range Breakout:
      stop_loss_pct: 3.0
      target_min_pct: 5.0
      target_max_pct: 10.0

scans:
  # Scan 1: Weekly breakout with volume + trend alignment
  - name: Breakout Momentum
    weight: 1.0
    scan_clause: >-
      ( {cash} ( latest close > 1 week ago high
      and latest volume > 1.5 * latest sma ( latest volume , 20 )
      and latest close > latest sma ( latest close , 50 )
      and latest close > latest sma ( latest close , 200 )
      and latest close > 100
      and latest close < 10000 ) )

  # Scan 2: Pullback bounce off 20 EMA in uptrend
  - name: EMA Pullback
    weight: 0.9
    scan_clause: >-
      ( {cash} ( latest close > latest ema ( latest close , 20 )
      and 1 day ago close <= 1 day ago ema ( 1 day ago close , 20 )
      and latest close > latest sma ( latest close , 50 )
      and latest volume > latest sma ( latest volume , 20 )
      and latest close > 100
      and latest close < 10000 ) )

  # Scan 3: Volatility squeeze breakout (BB squeeze proxy)
  - name: Range Breakout
    weight: 0.85
    scan_clause: >-
      ( {cash} ( latest close > 5 days ago max( 5 , latest high )
      and latest close > latest sma ( latest close , 20 )
      and latest volume > 1.3 * latest sma ( latest volume , 20 )
      and latest close > 100
      and latest close < 10000 ) )

ranking:
  # Scoring weights (should sum to ~1.0)
  volume_ratio: 0.25
  momentum_sweet_spot: 0.25   # Prefer 1.5–6% daily move (not overextended)
  liquidity: 0.20             # Prefer higher rupee turnover
  setup_weight: 0.10          # Scan type priority
  confluence: 0.10            # Bonus when 2+ scans agree
  price_stability: 0.10       # Penalize extreme % moves (>8%)

# Market regime gate — skip all picks on bearish Nifty days.
regime:
  enabled: true
  skip_bearish_days: true
  neutral_probability_boost: 5.0   # Raise min probability in neutral markets
  bearish_probability_boost: 12.0

# 7-layer ensemble engine (fake breakout, MC, walk-forward, MTF, Wyckoff).
advanced:
  enabled: true
  history_days: 90
  deep_analyze_top: 20
  min_probability: 62            # Stricter bar (was 58)
  max_fake_breakout_risk: 0.50
  max_fake_move_risk: 0.55
  reject_grades: ["D", "C"]
  weights:
    basic_score: 0.25
    ensemble: 0.75

ensemble:
  min_ensemble_score: 0.62
  min_monte_carlo_win_rate: 0.50
  min_walk_forward_edge: 0.40
  min_mtf_alignment: 0.50
  allowed_tiers: ["ELITE", "STRONG", "PASS"]
  elite_ensemble_score: 0.78
  strong_ensemble_score: 0.68
  elite_monte_carlo: 0.58
  strong_monte_carlo: 0.52

monte_carlo:
  simulations: 500
  horizon_days: 10

diversification:
  enabled: true
  max_per_sector: 1              # No two picks from same sector
  max_correlation: 0.75          # Reject highly correlated pairs

# Daily self-training ML on whole NSE universe (yfinance + scikit-learn).
# Retrains automatically once per day when you run the bot.
ml:
  enabled: true
  auto_train_daily: true
  model_dir: models
  universe_file: data/nse_universe.txt
  max_symbols: 200               # How many stocks to train on (batched)
  history_days: 365              # 1 year of OHLCV per stock
  batch_size: 40                 # yfinance download batch size
  label_horizon: 10                # Trading days to check outcome
  target_pct: 5.0                  # Label = hit +5% before -3%
  stop_pct: 3.0
  train_on_setup_days_only: true # Only learn from swing-like days (less noise)
  min_samples: 800                 # Skip retrain if fewer samples
  retrain_if_older_hours: 20       # Retrain if model older than 20h
  min_probability: 0.48            # Reject picks below this ML score
  weight_in_probability: 0.25      # ML weight in final probability blend

notifications:
  telegram: true
  sms: false
  whatsapp: false
